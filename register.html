<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshCart - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #d9f99d,
                #bbf7d0,
                #dcfce7
            );

            padding: 30px 10px;
        }

        .register-box {
            width: 430px;
            max-width: 100%;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;

            color: #16a34a;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;

            color: #166534;

            font-weight: bold;

            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #bbf7d0;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            background: #fafffb;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #16a34a;

            box-shadow: 0 0 5px rgba(22, 163, 74, 0.2);
        }

        textarea {
            height: 80px;

            resize: none;
        }

        .register-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #16a34a;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #15803d;
        }

        .login-text {
            text-align: center;

            margin-top: 18px;

            color: #666;
        }

        .login-text a {
            color: #15803d;

            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="register-box">

    <div class="logo">
        🛒 FreshCart
    </div>

    <p class="subtitle">
        Create your account
    </p>


    <form id="registerForm">


        <!-- FULL NAME -->

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
                pattern="[0-9]{10}"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                required
            >

        </div>


        <!-- ADDRESS -->

        <div class="form-group">

            <label for="address">
                Delivery Address
            </label>

            <textarea
                id="address"
                placeholder="House No, Street, Area"
                required
            ></textarea>

        </div>


        <!-- CITY -->

        <div class="form-group">

            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
                required
            >

        </div>


        <!-- STATE -->

        <div class="form-group">

            <label for="state">
                State
            </label>

            <select id="state" required>

                <option value="">
                    Select State
                </option>

                <option>Andhra Pradesh</option>
                <option>Telangana</option>
                <option>Karnataka</option>
                <option>Tamil Nadu</option>
                <option>Kerala</option>
                <option>Maharashtra</option>
                <option>Odisha</option>
                <option>Delhi</option>
                <option>Other</option>

            </select>

        </div>


        <!-- PINCODE -->

        <div class="form-group">

            <label for="pincode">
                Pincode
            </label>

            <input
                type="text"
                id="pincode"
                placeholder="Enter 6-digit pincode"
                maxlength="6"
                pattern="[0-9]{6}"
                required
            >

        </div>


        <!-- REGISTER -->

        <button
            type="submit"
            class="register-btn">

            Create Account

        </button>

    </form>


    <!-- LOGIN -->

    <p class="login-text">

        Already have an account?

        <a href="login.html">
            Sign In
        </a>

    </p>

</div>



<script>

    document
        .getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            // Get values

            const user = {

                name: document.getElementById("name").value,

                email: document.getElementById("email").value,

                phone: document.getElementById("phone").value,

                password: document.getElementById("password").value,

                address: document.getElementById("address").value,

                city: document.getElementById("city").value,

                state: document.getElementById("state").value,

                pincode: document.getElementById("pincode").value

            };


            // Save user details

            localStorage.setItem(
                "freshCartUser",
                JSON.stringify(user)
            );


            // Success message

            alert(
                "Registration Successful! 🛒\n\nWelcome to FreshCart!"
            );

            window.location.href = "login.html";

        });

</script>


</body>

</html>
