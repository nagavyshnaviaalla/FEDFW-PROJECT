<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | FreshCart</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .orders-container {
            padding: 45px 7%;
            min-height: 65vh;
        }

        .orders-container h1 {
            color: #174d35;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .orders-subtitle {
            color: #78847b;
            margin-bottom: 30px;
        }

        .order-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 1px solid #edf0eb;
            padding-bottom: 17px;
        }

        .order-header h3 {
            color: #174d35;
            margin-bottom: 8px;
        }

        .order-header p {
            color: #78847b;
            font-size: 13px;
        }

        .order-status {
            background: #e8f3e4;
            color: #347a3b;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            height: fit-content;
        }

        .order-products {
            padding: 17px 0;
        }

        .order-product {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 13px;
        }

        .order-product img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 9px;
        }

        .order-product h4 {
            color: #26352b;
            margin-bottom: 5px;
        }

        .order-product p {
            color: #78847b;
            font-size: 13px;
        }

        .order-footer {
            border-top: 1px solid #edf0eb;
            padding-top: 17px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            color: #174d35;
        }

        .order-footer strong {
            font-size: 18px;
        }

        .empty-orders {
            background: white;
            text-align: center;
            padding: 55px 20px;
            border-radius: 14px;
        }

        .empty-orders h2 {
            color: #174d35;
            margin-bottom: 12px;
        }

        .empty-orders p {
            color: #78847b;
            margin-bottom: 25px;
        }

        @media(max-width: 600px) {
            .orders-container {
                padding: 30px 5%;
            }

            .orders-container h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="top-bar">Fresh groceries delivered to your doorstep</div>

    <header class="navbar">
        <a href="index.html" class="logo">Fresh<span>Cart</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="smart.html">Smart Hub</a>
            <a href="products.html">Products</a>
            <a href="orders.html" class="active">My Orders</a>
            <a href="profile.html">Profile</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html">Login</a>
            <a href="register.html" class="register-btn">Register</a>
            <a href="cart.html" class="cart-btn">Cart</a>
        </div>
    </header>

    <main class="orders-container">
        <h1>My Orders</h1>
        <p class="orders-subtitle">
            Track and manage your grocery orders.
        </p>

        <div id="ordersList"></div>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">Fresh<span>Cart</span></a>
        <p>Your everyday grocery shopping partner.</p>
        <p class="copyright">© 2026 FreshCart. All rights reserved.</p>
    </footer>

    <script src="order.js"></script>
</body>
</html>
