<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FreshCart</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #e8f8ed, #fff3e5);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 31px;
            font-weight: 700;
            color: #168447;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #26352b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
            font-weight: 600;
            color: #37483b;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce5de;
            border-radius: 9px;
            outline: none;
            font-size: 13px;
            background: #fbfdfb;
        }

        input:focus {
            border-color: #168447;
            box-shadow: 0 0 0 3px rgba(22,132,71,0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 9px;
            background: #168447;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #106b38;
        }

        #message {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 23px;
            font-size: 13px;
            color: #666;
        }

        .register-link a {
            color: #168447;
            text-decoration: none;
            font-weight: 600;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #777;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">FreshCart</div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Login to continue shopping with FreshCart</p>

    <form id="loginForm">

        <label>Email Address</label>
        <input type="email" id="loginEmail"
               placeholder="Enter your registered email" required>

        <label>Password</label>
        <input type="password" id="loginPassword"
               placeholder="Enter your password" required>

        <button type="submit">Login to FreshCart</button>

        <p id="message"></p>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

    <a href="index.html" class="home-link">← Back to Home</a>

</div>

<script src="login.js"></script>

</body>
</html>
