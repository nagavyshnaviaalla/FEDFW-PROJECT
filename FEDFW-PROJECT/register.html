<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GROVIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #e8f8ed, #fff5e9);
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            color: #168447;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            color: #26352b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 13px;
            font-weight: 600;
            color: #37483b;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dce5de;
            border-radius: 9px;
            outline: none;
            font-size: 13px;
            background: #fbfdfb;
        }

        input:focus, textarea:focus {
            border-color: #168447;
            box-shadow: 0 0 0 3px rgba(22,132,71,0.10);
        }

        textarea {
            resize: vertical;
            min-height: 75px;
        }

        .register-btn {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            background: #168447;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #106b38;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .login-link a {
            color: #168447;
            font-weight: 600;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">GROVIA</div>

    <h2>Create Account</h2>
    <p class="subtitle">Join GROVIA and enjoy easy grocery shopping!</p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit phone number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label>Password</label>
        <input type="password" id="password"
               placeholder="Create a password" minlength="6" required>

        <label>Delivery Address</label>
        <textarea id="address" placeholder="House number, street, area" required></textarea>

        <label>City</label>
        <input type="text" id="city" placeholder="Enter your city" required>

        <label>PIN Code</label>
        <input type="text" id="pincode" placeholder="6-digit PIN code"
               pattern="[0-9]{6}" maxlength="6" required>

        <button type="submit" class="register-btn">Create Account</button>

        <p id="message"></p>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script src="register.js"></script>
</body>
</html>
